name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'include/**'
      - 'extern/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'include/**'
      - 'extern/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NDK_VERSION: "27.2.12479018"
  BUILD_TYPE: Release

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0

    - name: Download SDL2 Android source (release-2.32.10)
      run: |
        SDL_URL="https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz"
        echo "Downloading SDL2 release..."
        curl -sSL "$SDL_URL" -o /tmp/sdl2.tar.gz
        mkdir -p extern/SDL
        tar xzf /tmp/sdl2.tar.gz -C extern/SDL --strip-components=1
        # Copy SDL2 Java glue into our source tree
        cp -r extern/SDL/android-project/app/src/main/java/org android/app/src/main/java/org
        # Create SDL2 include symlink: the codebase uses <SDL2/SDL.h>,
        # but SDL2's source tree has headers at include/SDL.h (no SDL2 prefix).
        # This symlink makes both resolve: extern/SDL/include/SDL2/SDL.h → SDL.h
        ln -sf . extern/SDL/include/SDL2
        echo "SDL2 Java sources installed"

    - name: Download GLM headers (header-only, not in NDK)
      run: |
        GLM_URL="https://github.com/g-truc/glm/archive/refs/tags/1.0.1.tar.gz"
        echo "Downloading GLM..."
        curl -sSL "$GLM_URL" -o /tmp/glm.tar.gz
        mkdir -p extern/glm
        tar xzf /tmp/glm.tar.gz -C extern/glm --strip-components=1
        echo "GLM $(grep -oP 'version \K[0-9.]+' extern/glm/CMakeLists.txt | head -1) installed"

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Cache Android SDK
      uses: actions/cache@v6
      with:
        path: |
          ~/.android/sdk
          ~/.android/cmdline-tools
        key: android-sdk-${{ runner.os }}-${{ env.NDK_VERSION }}
        restore-keys: |
          android-sdk-${{ runner.os }}-

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: |
        echo "Installing SDK packages..."
        yes | sdkmanager --install \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;${{ env.NDK_VERSION }}" \
          "cmake;3.22.1" \
          "platform-tools" 2>&1 | tail -30
        echo "Done — SDK packages installed"

    - name: Verify NDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
        ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "NDK not in expected location"
        find $ANDROID_HOME -name "ndk-build" 2>/dev/null | head -5 || true

    - name: Install Gradle (for wrapper generation)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq gradle
        gradle --version | head -1

    - name: Generate Gradle wrapper
      working-directory: android
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.11.1
        fi
        chmod +x gradlew
        ls -la gradlew gradle/wrapper/gradle-wrapper.jar

    - name: Verify source files exist
      run: |
        echo "Checking critical source files..."
        test -f src/core/application.cpp && echo "  application.cpp OK" || echo "  MISSING application.cpp"
        test -f src/core/window.cpp && echo "  window.cpp OK" || echo "  MISSING window.cpp"
        test -f src/rendering/vk_context.cpp && echo "  vk_context.cpp OK" || echo "  MISSING vk_context.cpp"
        test -f src/pipeline/asset_manager.cpp && echo "  asset_manager.cpp OK" || echo "  MISSING asset_manager.cpp"
        test -f extern/imgui/imgui.cpp && echo "  imgui OK" || echo "  MISSING imgui"
        test -f extern/vk-bootstrap/src/VkBootstrap.cpp && echo "  vk-bootstrap OK" || echo "  MISSING vk-bootstrap"
        test -f extern/lua-5.1.5/src/lapi.c && echo "  lua OK" || echo "  MISSING lua"
        test -f extern/SDL/include/SDL.h && echo "  SDL2 OK" || echo "  MISSING SDL2"
        test -f extern/SDL/include/SDL2/SDL.h && echo "  SDL2/SDL.h symlink OK" || echo "  MISSING SDL2 symlink"
        test -f extern/glm/glm/glm.hpp && echo "  GLM OK" || echo "  MISSING GLM"

    - name: Build APK (Debug)
      working-directory: android
      run: |
        export ANDROID_HOME=$ANDROID_HOME
        set -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tail -80
        echo "--- Searching for APK ---"
        find . -name '*.apk' -o -name '*.aab' 2>/dev/null | head -20 || echo "No APK/AAB found anywhere"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: wowee-android-debug-${{ github.sha }}
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn

    - name: Build APK (Release)
      working-directory: android
      run: |
        export ANDROID_HOME=$ANDROID_HOME
        set -o pipefail
        ./gradlew assembleRelease --stacktrace 2>&1 | tail -80
        echo "--- Searching for APK ---"
        find . -name '*.apk' -o -name '*.aab' 2>/dev/null | head -20 || echo "No APK/AAB found anywhere"

    - name: Upload Release APK
      uses: actions/upload-artifact@v7
      with:
        name: wowee-android-release-${{ github.sha }}
        path: android/app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    - name: Build summary
      run: |
        echo "## Android Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Variant | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
        if ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null; then
          SIZE=$(du -h android/app/build/outputs/apk/debug/*.apk | head -1 | cut -f1)
          echo "| Debug   | Built ($SIZE) |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Debug   | Failed |" >> $GITHUB_STEP_SUMMARY
        fi
        if ls android/app/build/outputs/apk/release/*.apk 2>/dev/null; then
          SIZE=$(du -h android/app/build/outputs/apk/release/*.apk | head -1 | cut -f1)
          echo "| Release | Built ($SIZE) |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Release | Failed |" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Note:** APK is signed with debug keystore. For distribution, sign with your own release keystore." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Assets:** The APK does NOT include WoW game data. Assets are downloaded on first launch." >> $GITHUB_STEP_SUMMARY